name: Build creator stats

# Reads the public data of the TRMNL Creator Leaderboard (read only) and publishes
# one small JSON per recipe and language on this repository's GitHub Pages.
on:
  schedule:
    - cron: '25 * * * *'        # every hour, about 15 minutes after the leaderboard refresh
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [refresh]             # optional external trigger (cron-job.org)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the JSON files
        run: node scripts/build.mjs --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
