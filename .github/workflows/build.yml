name: Build creator stats

# Reads the public data of the TRMNL Creator Leaderboard (read only) and publishes
# one small JSON per recipe and language on this repository's GitHub Pages.
# Triggered every hour by cron-job.org (GitHub API), at hh:20, after the leaderboard
# refresh (data collected around hh:07). If the leaderboard is late, build.mjs waits for it.
on:
  workflow_dispatch:             # "Run workflow" button, also used by cron-job.org

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the JSON files
        run: node scripts/build.mjs --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
